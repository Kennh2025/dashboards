<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Nitori Research Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with live result, scrolling tab bar, one working panel per tab. Data pages are tables and small SVG charts. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#0F1B33; --muted:#5A6781; --line:#D8DFEA; --soft:#EAEFF6;
  --a1:#1D4FD8; --a2:#C2570C; --rec:#0F1B33; --pos:#0E7A53; --neg:#B42318; --warn:#9A6200; --field:#6D3FC0;
  --a1-soft:#E3EBFD; --a2-soft:#FCEBDD; --pos-soft:#DDF3EA; --neg-soft:#FBE4E1; --warn-soft:#FBF0D4; --field-soft:#EDE5FA;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111F; --surface:#121B2E; --ink:#E8EDF7; --muted:#97A4BF; --line:#26324B; --soft:#1A2540;
  --a1:#7BA6FF; --a2:#FF9A55; --rec:#E8EDF7; --pos:#4ED1A0; --neg:#FF8A7D; --warn:#F2BE5C; --field:#B79BF2;
  --a1-soft:#192A55; --a2-soft:#3A2412; --pos-soft:#0F3328; --neg-soft:#3F1B18; --warn-soft:#3A2D0E; --field-soft:#2C2150; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111F; --surface:#121B2E; --ink:#E8EDF7; --muted:#97A4BF; --line:#26324B; --soft:#1A2540;
  --a1:#7BA6FF; --a2:#FF9A55; --rec:#E8EDF7; --pos:#4ED1A0; --neg:#FF8A7D; --warn:#F2BE5C; --field:#B79BF2;
  --a1-soft:#192A55; --a2-soft:#3A2412; --pos-soft:#0F3328; --neg-soft:#3F1B18; --warn-soft:#3A2D0E; --field-soft:#2C2150; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding-block:12px 8px}
.head h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.live{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.live .k{display:flex;flex-direction:column;min-width:0}
.live .k b{font-family:var(--mono);font-size:18px;font-weight:500}
.live .k span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)} .chip.neg{background:var(--neg-soft);color:var(--neg)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.a1{background:var(--a1-soft);color:var(--a1)} .chip.a2{background:var(--a2-soft);color:var(--a2)} .chip.field{background:var(--field-soft);color:var(--field)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)} nav.tabs button[aria-selected="true"]{color:var(--a1);border-bottom-color:var(--a1)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
main{padding-block:18px 60px}
section.panel{display:block}
h2{font-size:17px;font-weight:600;margin:26px 0 4px;letter-spacing:-.005em} h2:first-child{margin-top:4px}
h3{font-size:14px;font-weight:600;margin:18px 0 6px}
p.lede{color:var(--muted);margin:0 0 12px;max-width:72ch}
.grid{display:grid;gap:14px} .g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} .g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.tile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .big{font-family:var(--mono);font-size:26px;font-weight:500;margin:2px 0;letter-spacing:-.02em}
.tile .small{font-size:12.5px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);font-size:12px;background:var(--surface)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
td.l,th.l{text-align:left} td.wrap-t{white-space:normal;min-width:240px}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--a1-soft)} tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
td.mono,.mono{font-family:var(--mono)}
td.dim,th.dim{opacity:.35}
td.cell{cursor:pointer} td.cell:hover{outline:1px solid var(--a1);outline-offset:-1px}
.neg{color:var(--neg)} .pos{color:var(--pos)} .muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.btn{font:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--soft)} .btn.on{background:var(--a1);border-color:var(--a1);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;border:0;background:var(--surface);color:var(--muted);padding:5px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0} .seg button[aria-pressed="true"]{background:var(--a1);color:#fff}
.chart{width:100%;min-width:0} .chart svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--font);fill:var(--muted);font-size:11.5px} svg text.v{fill:var(--ink);font-family:var(--mono);font-size:11.5px} svg .grid{stroke:var(--line);stroke-width:1}
.model{display:grid;gap:18px;grid-template-columns:minmax(0,330px) minmax(0,1fr);align-items:start}
@media (max-width:900px){.model{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}
.ctrl label .ref{grid-column:1/-1;font-size:11.5px;color:var(--muted)} .ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--a1)}
.ctrl .val{font-family:var(--mono)} .changed{color:var(--a1);font-weight:600}
input[type=number]{font:inherit;font-family:var(--mono);width:74px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);text-align:right}
input[type=number].changed{border-color:var(--a1);background:var(--a1-soft)}
input[type=search]{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:min(100%,280px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:6px 0}
details.fold>summary{cursor:pointer;padding:9px 12px;font-weight:500;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.fold>summary::-webkit-details-marker{display:none} details.fold>summary::before{content:'\25B8';color:var(--muted)} details.fold[open]>summary::before{content:'\25BE'}
details.fold>div{padding:2px 14px 12px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px solid var(--line)} .tree>ul{border-left:0;padding-left:0}
.tree summary{cursor:pointer;padding:5px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tree li{padding:1px 0} .tree .leaf{padding:5px 0 5px 14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tree .nm{font-weight:500} .tree .fm{color:var(--muted);font-size:12.5px} .tree .vl{font-family:var(--mono);font-size:12.5px}
.heat td{text-align:center;font-family:var(--mono);font-size:12.5px;padding:7px 8px} .heat td:first-child{text-align:right}
.bars .b{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:4px 0;font-size:13px;cursor:pointer}
.bars .b.off{opacity:.38} .bars .tr{height:14px;background:var(--soft);border-radius:3px;position:relative}
.bars .fl{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--a2)} .bars .b.me .fl{background:var(--a1)}
.bars .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.bars .b{grid-template-columns:110px 1fr 56px}}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:280px;display:none;line-height:1.4}
#tip b{font-weight:600} .note{font-size:12.5px;color:var(--muted);max-width:80ch} .callout{border-left:3px solid var(--a1);background:var(--a1-soft);padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0;max-width:88ch}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)} ul.clean{margin:4px 0;padding-left:18px} ul.clean li{margin:3px 0;max-width:90ch}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.stackbar{display:flex;height:26px;border-radius:5px;overflow:hidden;background:var(--soft)} .stackbar>div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-family:var(--mono);min-width:0;overflow:hidden}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.quick button{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.quick button:hover{border-color:var(--a1)} .quick b{display:block;font-weight:600} .quick span{font-size:12.5px;color:var(--muted)}
.theme{margin-left:auto}
.drv .dl{font-size:12.5px;margin-bottom:3px}.drv .yrs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ctrl label.yr{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}.ctrl label.yr input{width:100%}
.tile .big{overflow-wrap:anywhere}.tile .big.sm{font-size:20px;line-height:1.25;margin:5px 0}
@media (max-width:720px){
  .head{padding-block:8px 4px;gap:4px 12px} .head h1{font-size:15.5px} .head .sub{display:none}
  .live{gap:6px 14px} .live .k b{font-size:15px} .live .k span{font-size:9.5px} .live .chip,.live .btn{font-size:11px;padding:2px 7px}
  nav.tabs button{padding:8px 10px;font-size:13px}
  .tile .big{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.fl{transition:width .2s}}

/* overview tabs */
.ov-root{--ov-c0:#1D4FD8;--ov-c1:#C2570C;--ov-c2:#0E7A53}
.ov-root h2{font-size:17px;font-weight:600;margin:26px 0 6px}.ov-root h2:first-child{margin-top:4px}.ov-root h3{font-size:14px;font-weight:600;margin:22px 0 8px}.ov-root h4{font-size:14px;margin:0}
.ov-root .ov-code{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:400}.ov-root .ov-lead{color:var(--muted);margin:0 0 8px;max-width:80ch}
.ov-hero{display:flex;gap:16px;align-items:center}.ov-hero p{margin:0;color:var(--muted);max-width:80ch}.ov-hero h2{margin:0 0 4px}
.ov-hero-logo{width:120px;height:auto;flex:0 0 auto;background:#fff;border-radius:6px;padding:6px;border:1px solid var(--line)}
.ov-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 4px}
.ov-tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.ov-tile b{display:block;font-family:var(--mono);font-size:19px;font-weight:500}.ov-tile span{font-size:12px;color:var(--muted)}
.ov-grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media (max-width:760px){.ov-grid2{grid-template-columns:1fr}}
.ov-root table{border-collapse:collapse;width:100%}.ov-root th,.ov-root td{text-align:left;white-space:normal;position:static;background:transparent;font-variant-numeric:normal}.ov-root tr:last-child td{border-bottom:1px solid var(--line)}
.ov-kv th{text-align:left;color:var(--muted);font-weight:500;padding:5px 10px 5px 0;vertical-align:top;width:34%;font-size:13px}.ov-kv td{padding:5px 0;font-size:13px;border-bottom:1px solid var(--line)}
.ov-tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);padding:6px 8px}.ov-tbl td{padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
.ov-root .ov-tbl .ov-r,.ov-root .ov-tbl th.ov-r{text-align:right;font-family:var(--mono);font-size:12.5px}.ov-root .ov-tbl tr.ov-hl td{background:var(--a1-soft)}
.ov-bars{display:flex;flex-direction:column;gap:6px}.ov-bar-row{display:grid;grid-template-columns:minmax(120px,42%) 1fr 70px;gap:8px;align-items:center;font-size:12.5px}
.ov-bl{color:var(--muted)}.ov-bt{height:12px}.ov-bf{display:block;height:12px;background:var(--a1);border-radius:0 4px 4px 0}.ov-bv{text-align:right;font-family:var(--mono);font-size:12px}
.ov-fine{font-size:11.5px;color:var(--muted);margin:6px 0 0}.ov-small{font-size:13px;color:var(--muted)}
.ov-flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}.ov-step{flex:1 1 170px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--a1);border-radius:6px;padding:9px 10px}
.ov-step b{display:block;font-size:13.5px}.ov-step span{font-size:12.5px;color:var(--muted)}.ov-arr{align-self:center;color:var(--muted);font-size:18px}
.ov-inds{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.ov-ind{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px}.ov-ind b{font-size:13.5px}.ov-ind p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.ov-callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 13px;border-radius:0 6px 6px 0;margin:12px 0;font-size:13px}
.ov-pmap{width:100%;height:auto}.ov-pmap .ov-ax{stroke:var(--line);stroke-width:1.5}.ov-pmap .ov-axl{fill:var(--muted);font-size:12px}
.ov-pmap circle{fill:var(--muted);stroke:var(--surface);stroke-width:2}.ov-pmap .ov-own circle{fill:var(--a1)}.ov-pmap text{fill:var(--ink);font-size:12px}
.ov-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ov-card-top{position:relative}.ov-photo{width:100%;height:150px;object-fit:cover;display:block;background:var(--soft)}
.ov-noimg{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600;background:var(--soft)}
.ov-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.ov-card-body{padding:11px 13px 13px}.ov-card-head{display:flex;align-items:center;gap:10px;min-height:34px}
.ov-logo{height:30px;max-width:110px;width:auto;object-fit:contain;background:#fff;border-radius:4px;padding:3px}.ov-logo.ov-noimg{height:30px;padding:0 8px;font-size:11px}
.ov-model{font-size:12.5px;color:var(--muted);margin:8px 0}.ov-lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 2px;font-weight:600}
.ov-card ul{margin:2px 0 0;padding-left:17px}.ov-card li{margin:2px 0}
.ov-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px;margin:6px 0}.ov-stats div{background:var(--bg);border-radius:6px;padding:5px 7px}

.ov-filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0}.ov-filters select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.ov-mapwrap{display:grid;grid-template-columns:1fr 300px;gap:12px;height:560px}@media (max-width:760px){.ov-mapwrap{grid-template-columns:1fr;height:auto}#ov-map{height:420px}}
#ov-map{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);position:relative;min-height:300px}
#ov-panel{overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.ov-detail{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}.ov-detail .ov-est{font-family:var(--mono);font-size:20px;font-weight:500}
.ov-kvs{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin-top:8px;line-height:1.35}.ov-kvs span{color:var(--muted)}.ov-kvs b{font-weight:500}.ov-kvs .ov-est-tag{display:block}
.ov-pt td{font-size:12px;padding:3px 4px}
.ov-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 0}

.ov-mk.ov-s1{background:var(--ov-c1);border-radius:2px}.ov-mk.ov-s2{background:var(--ov-c2);transform:rotate(45deg);border-radius:2px}
.ov-svgmap .ov-pt{cursor:pointer}
.ov-credits{margin-top:22px;font-size:11.5px;color:var(--muted)}.ov-credits a{color:var(--a1)}
.ov-mapctl{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}

.ov-pop h4{font-size:14px;margin:0 22px 2px 0}.ov-popx{position:absolute;top:4px;right:6px;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer}

.ov-mkr{cursor:pointer}.ov-mkr:hover>*,.ov-sel>*{stroke:var(--ink)!important}

<div class=ov-grid2><div><h3>Key facts</h3><table class=ov-kv><tr><th>Incorporated</th><td>March 1972, Sapporo (as 似鳥家具卸センター); renamed Nitori 1986</td></tr><tr><th>Listing</th><td>TSE Prime, code 9843 (Sapporo listing 1989)</td></tr><tr><th>Fiscal year</th><td>Ends 31 March since FY51 (FY51 lasted 13 months 11 days)</td></tr><tr><th>Accounting</th><td>IFRS from FY53 (FY52 restated); JGAAP before</td></tr><tr><th>Group</th><td>Holding company, 38 consolidated subsidiaries; segments: Nitori business, Shimachu business</td></tr><tr><th>Self-description</th><td>&#x27;Manufacturing, logistics and IT retailer&#x27; (製造物流IT小売業)</td></tr><tr><th>Major acquisition</th><td>Shimachu: subsidiary Jan 2021, wholly owned May 2021</td></tr></table></div><div><h3>Five-year revenue</h3><div class=ov-bars><div class=ov-bar-row><span class=ov-bl>FY50</span><span class=ov-bt><span class=ov-bf style='width:85.6%'></span></span><span class=ov-bv>¥811.6bn</span></div><div class=ov-bar-row><span class=ov-bl>FY51 (13.4 months)</span><span class=ov-bt><span class=ov-bf style='width:100.0%'></span></span><span class=ov-bv>¥948.1bn</span></div><div class=ov-bar-row><span class=ov-bl>FY52 (IFRS)</span><span class=ov-bt><span class=ov-bf style='width:94.6%'></span></span><span class=ov-bv>¥896.7bn</span></div><div class=ov-bar-row><span class=ov-bl>FY53</span><span class=ov-bt><span class=ov-bf style='width:98.0%'></span></span><span class=ov-bv>¥928.8bn</span></div><div class=ov-bar-row><span class=ov-bl>FY54</span><span class=ov-bt><span class=ov-bf style='width:96.2%'></span></span><span class=ov-bv>¥912.2bn</span></div></div><p class=ov-fine>Revenue, JPY bn. FY51 covers 13.4 months and FY52 is the first IFRS-restated year, so growth across them is not comparable.</p><p class=ov-fine>Operating margin: FY50 17.0% · FY51 14.8% · FY52 13.9% · FY53 12.7% · FY54 13.8%.</p></div></div>
<h3>Business model: one company from design to doorstep</h3><div class=ov-flow><div class=ov-step><b>Plan &amp; design</b><span>Own merchandising team designs for Japanese homes</span></div><span class=ov-arr>→</span><div class=ov-step><b>Make &amp; source</b><span>Own furniture factories in Vietnam (since 2003); procurement company in China (2004)</span></div><span class=ov-arr>→</span><div class=ov-step><b>Move</b><span>Own logistics company Home Logistics (2010); Kawasaki distribution centre under construction</span></div><span class=ov-arr>→</span><div class=ov-step><b>Sell</b><span>593 Nitori + 185 Deco Home + 30 N+ stores in Japan, Shimachu (52), 209 overseas, online</span></div></div>
<p class=ov-fine>The chain is why Nitori earns a 13.8% operating margin while the listed peers earn 4.3% to 9.4%.</p>
<h3>Industry context</h3><div class=ov-inds><div class=ov-ind><b>Mature home market, traffic is the problem</b><p>Nitori&#x27;s existing stores saw customers at 92.8% and sales at 95.8% of the prior year in FY54; the company blames too few new products.</p></div><div class=ov-ind><b>Weak yen raises import costs</b><p>Products are largely made overseas (own factories in Vietnam, sourcing in China); the purchase rate was 148.06 JPY/USD in FY54 and the FY27 plan assumes 155.</p></div><div class=ov-ind><b>Growth has moved to lifestyle and small-ticket formats</b><p>MUJI +18.6% and Seria +8.2% vs home centres DCM −0.4% and Kohnan +3.7%, and Nitori −1.8% (latest years).</p></div><div class=ov-ind><b>Consolidation</b><p>Nitori bought Shimachu (2021) after a contest with DCM; DCM merged its home-centre subsidiaries (2021).</p></div><div class=ov-ind><b>Online</b><p>Online is 11.0% of Nitori-business revenue (FY54), down 0.5 pt; online sales fell from ¥96.8bn to ¥90.9bn.</p></div></div>
<div class=ov-callout>Data gap: the overall market size for home furnishings in Japan is not yet sourced (to add: METI Commercial Dynamics Statistics). The points above use the companies' own disclosures.</div>

<div class=ov-card-body><div class=ov-card-head><div class='ov-logo ov-noimg'>IKEA Japan</div><h4>IKEA Japan</h4></div>
<p class=ov-model>Japanese arm of IKEA: flat-pack furniture and home furnishings at low prices; re-entered Japan in 2006 (Funabashi).</p><div class=ov-stats><div><span>Financials</span><b>not listed</b></div></div>
<p class=ov-lab>Overlap with Nitori</p><p class=ov-small>The closest concept to Nitori: furniture plus home furnishings, design at a low price.</p>

<p class=ov-model>Beisia-group home centre: 263 stores in 29 prefectures (Feb 2026); private brands about 30% of sales.</p><div class=ov-stats><div><span>Financials</span><b>not listed</b></div></div>
<p class=ov-lab>Overlap with Nitori</p><p class=ov-small>Storage, home goods and private-brand household products; overlaps with Shimachu in the Kanto region.</p>
<p class=ov-lab>Key differences vs Nitori</p><ul class=ov-small><li>DIY-centred home centre, but with a similar own-brand (SPA-like) logic.</li><li>No listed financials; figures are from secondary sources.</li></ul></div></article></div>
<h3>Summary: strengths and weaknesses</h3><table class=ov-tbl><tr><th>Company</th><th>Strengths</th><th>Weaknesses</th></tr><tr class=ov-hl><td><b>Nitori</b></td><td>Price/value, own manufacturing and logistics, national density, 13.8% margin</td><td>Falling traffic, yen exposure, slower growth</td></tr><tr><td><b>MUJI</b></td><td>Brand, design, fast growth incl. overseas</td><td>Lower margin; furniture is not the core</td></tr><tr><td><b>Seria</b></td><td>Low ticket, high frequency, high ROE</td><td>No big-ticket items</td></tr><tr><td><b>DCM</b></td><td>Scale in DIY/garden, M&amp;A</td><td>Low margin, flat sales</td></tr><tr><td><b>Kohnan</b></td><td>Pro/trade customers, Kansai density</td><td>Low margin, regional</td></tr><tr><td><b>IKEA Japan</b></td><td>Global design brand, destination stores</td><td>Few stores, self-assembly</td></tr><tr><td><b>Cainz</b></td><td>Large private-brand home centre</td><td>DIY-centred, unlisted</td></tr></table>

<div><h3>Method</h3><ol class=ov-small><li>Locations: OpenStreetMap (© OpenStreetMap contributors, ODbL); prefecture from the GSI reverse geocoder. The official store locator is not used: its terms allow viewing and printing for personal, non-commercial use only.</li>
<li>Floor area: format average (Nitori 4,019 m², Deco Home 580 m², Shimachu 7,790 m²), for Nitori stores scaled by the OSM building footprint × levels vs the Nitori median where available (ratio capped 0.4–2.0); Shimachu outlines often cover whole complexes and are not used.</li>
<li>Sales: Japan store revenue of Nitori + Deco Home (75.7% × ¥816.1bn) and Shimachu store sales (¥98.7bn) spread by floor area, i.e. the same sales per m² for every store in a format.</li>

<div class=ov-howto><h3>How the index is calculated</h3>
<ol>
<li><b>What the company publishes.</b> For every month, the existing-store figure compared with the same month a year earlier (prior year = 100): sales, customers, and average ticket (= sales &divide; customers). Example: customers 104.1 means 4.1% more customers than the same month last year.</li>
<li><b>Starting point.</b> Each calendar month of Mar 2011 &ndash; Feb 2012 is set to 100.</li>
<li><b>Chaining.</b> A month's level = the level of the same month one year earlier &times; this year's figure &divide; 100. Each calendar month is chained with itself (September with September), so there are twelve separate chains.</li>
</ol>
<p class=ov-small>Worked example, September 2026:</p>
<table class=ov-tbl><tr><th></th><th class=ov-r>Level 2025-09</th><th class=ov-r>Year-on-year 2026-09</th><th class=ov-r>Level 2026-09 = level &times; YoY &divide; 100</th></tr><tr><td>Customers</td><td class=ov-r>101.41</td><td class=ov-r>104.1%</td><td class=ov-r><b>105.57</b></td></tr><tr><td>Average ticket</td><td class=ov-r>126.00</td><td class=ov-r>98.2%</td><td class=ov-r><b>123.74</b></td></tr><tr><td>Sales</td><td class=ov-r>127.77</td><td class=ov-r>102.3%</td><td class=ov-r><b>130.71</b></td></tr></table>
<p class=ov-small>Customers &times; ticket is about sales: 105.6% &times; 123.7% &asymp; 130.6% against the sales index 130.7 (small gap = rounding of the published figures).</p>
<p class=ov-small><b>Why the charts and tiles show a 12-month average.</b> The twelve chains are independent, so single months jump around: over the last 12 months the sales index ranges from 99 to 153. Quoting one month (&ldquo;September&rdquo;) would mostly show which chain happened to be high. The average of the last 12 monthly levels (sales 127, customers 99, ticket 129) removes that noise. Because it is an average, the three no longer multiply exactly.</p>
<p class=ov-small><b>What it is not.</b> It is not a price index and not a measured level of traffic. (1) The set of existing stores changes every year, so the chain approximates, but is not, a like-for-like path. (2) The company does not adjust for weekdays, and the figures are rounded to one decimal, so small errors accumulate over fifteen chain steps. (3) &ldquo;Ticket&rdquo; is sales per customer: price changes, product mix and basket size all move it. Use the index for direction and turning points, not for exact levels.</p></div>
<p class=ov-fine>Index = chained existing-store YoY, base Mar 2011-Feb 2012 = 100; approximate (the existing-store set changes every year). Simple averages of monthly YoY, not sales-weighted.</p>

<h3>What comes next: the fixed-basket panel</h3>
<p class=ov-small>History explains the direction; it cannot say how far Nitori's shelf prices actually moved, item by item, against MUJI, IKEA and Cainz. That is the job of the fixed-basket panel (matched-basket price gap and promotion intensity), which starts collecting from now on; there is no item-level price history to rebuild legitimately.</p>

_tools as at,valuation as V;b,_,_,_,_,by,_,v=at._setup();e=V.evaluate(by,v,b);k,g,r=e['ke'],e['g'],e['dcf_rows'][-1];t=r['t_years'];n=r['net_income']*(1+g);R=r['revenue']*(1+g);sh=b['shares_mn'];tp=lambda f,x=0:round(((e['pv_explicit']+f/(k-g)/(1+k)**t-x)/sh)*(1+k)-v['dps'],1);ri=1-r['fcfe']*(1+g)/n;print('RONE_default',round(g/ri,4),'reinv',round(ri,3));print('TP_RONE_ke',tp(n*(1-g/k)));f=n+(v['da_pct_revenue']-4.9-v['lease_pct_revenue'])/100*R-v['nwc_pct_delta_revenue']/100*r['revenue']*g;K=sum(85000/6/(1+k)**(t+j) for j in (1,2,3));print('TP_split',tp(f),'TP_split_kawasaki',tp(f,K),'PV_kawasaki_mn',round(K))\"", "command B (L5 leave-one-out fair value today with the tool's own function; prints Muji 2765, Seria 5774, DCM 4288, Kohnan 4295): python3 -c \"import sys;sys.path.insert(0,'scripts');import multiples_agent as m;d,peers,base,plan,hist,ab,av=m.setup();[print(d[p]['name'],round(m.lens_values(d,peers,hist,plan['eps']['value'],572.21748,0.07,32,drop=p)[0]['L5'])) for p in peers]\"", "inline arithmetic: 2352.4/161.05 = 14.61; 2485/168.81 = 14.72; 85000/572.21748 = 148.5; 31448/565.0715 = 55.7; (0.45x2258.7 + 0.45x15.94x161.05 + 0.10x4202.9)x1.07 - 32 = 2741; (0.9x2258.7 + 0.1x4202.9)x1.07 - 32 = 2593; 17.79 +/- 1.96x10.1"]}}, "2": {"r1": {"agent": "2", "target_price_12m_jpy": 2985, "range_jpy": {"low": 2385, "base": 2985, "high": 3369}, "confidence_0_1": 0.3, "argument": "Same three counted lenses, re-weighted 0.45/0.45/0.10 (L1 peer P/E / L2 own-history P/E / L5 P/B-ROE): fair value today 2,819.5, x1.07 - 32 = 2,985. The 3,369 equal weight lands 10 JPY from today's price rolled forward (3,379). No lens uses today's price as an input, so this is partly a coincidence. But the three lens values are spread out (SD 976, SE of the mean 564), so the match proves nothing. L2 is close to a restatement (current 19.80x vs 5-year median 19.08x). L1 is independent (2,385). L5 is too unstable to carry a third of the weight: its fair value is 2,766-5,774 leave-one-out and 2,832 if the secondary-table ROE definition is used instead of the computed one. The implied multiple is 17.5x plan EPS, a 25% premium to the 14.03x peer median. The 4-point P/E-ROE fit puts Nitori at 17.8x.", "key_numbers": [{"what": "Fair value today, weights 0.45/0.45/0.10 on L1 2,258.7 / L2 3,072.8 / L5 4,202.9", "value": 2819.5, "source": "multiples_agent.py --json lenses; inline python weighted sum"}, {"what": "12-month target = 2,819.5 x 1.07 - 32", "value": 2985, "source": "inline python"}, {"what": "Today's price rolled forward = 3,188 x 1.07 - 32", "value": 3379, "source": "inline python"}, {"what": "Equal-weight 12m (dashboard)", "value": 3369, "source": "multiples_agent.py --json result.target_price_12m"}, {"what": "SD of the three counted lens fair values (L1, L2, L5)", "value": 976, "source": "inline python np.std(ddof=1)"}, {"what": "L5 fair value, leave-one-out min (drop Muji, P/B 1.55x, R2 1.0)", "value": 2766, "source": "inline python m.lens_values(drop=7453)"}, {"what": "L5 fair value, leave-one-out max (drop Seria, P/B 3.24x, R2 1.0)", "value": 5774, "source": "inline python m.lens_values(drop=2782)"}, {"what": "L5 fair value using the secondary-table ROE column (Muji 16.9, Seria 16.3, DCM 5.9, Kohnan 6.9; Nitori 9.0) instead of the computed ROE", "value": 2832, "source": "data/market/peer_fundamentals.csv implied_roe_pct; inline python regression"}, {"what": "L5 jackknife SE vs L1 jackknife SE (JPY)", "value": 1842, "source": "inline python; L1 SE 576"}, {"what": "Nitori current P/E on plan EPS vs own 5-year median 19.08x", "value": 19.8, "source": "agent_tools.py facts market_snapshot; nitori_year_end_per_history"}, {"what": "Implied P/E of my fair value (2,819.5 / 161.05); premium to peer median 14.03x = 24.8%", "value": 17.51, "source": "inline python"}, {"what": "Diagnostic only: 4-peer P/E vs ROE fit at Nitori ROE 8.76% (R2 0.47, SE 10.1x)", "value": 17.79, "source": "inline python m.reg"}, {"what": "12m price if L2 uses latest year-end P/E 15.94x instead of the median", "value": 2741, "source": "inline python"}, {"what": "12m price at Agent 1 model FY27 EPS 156.6 instead of plan 161.05", "value": 2914, "source": "agent_tools.py value paths.fy27.eps; inline python"}, {"what": "12m price if roll-forward uses the market-implied 4.7% instead of 7.0%", "value": 2920, "source": "inline python 2,819.5 x 1.047 - 32"}], "weakest_points_of_my_view": ["Only four peers with mixed fiscal years (Muji FY25/8 base, its FY26/8 forward P/E already stale), Seria non-consolidated, IFRS vs JGAAP. The effect on the median is not quantified because peers' lease and goodwill data were not collected.", "The 0.45/0.45/0.10 weights are a judgement. The evidence says L5 is unreliable but does not set 0.10 exactly. Inverse-variance weights from jackknife SEs (L1 576, L2 105, L5 1,842) would put 96.5% on L2 and give 3,232. I reject that because the 105 for L2 ignores the trailing vs forward and JGAAP vs IFRS errors, but it shows the weights are not unique.", "L2 is a trailing year-end P/E applied to forward EPS. Its median 19.08x includes JGAAP years, and the latest point is 15.94x, which gives 2,741.", "Using plan EPS 161.05 is consistent with the peers' forward P/Es, which also rest on company forecasts. But Apr-Sep same-store sales were 100.0 and all-store 102.7 against a plan that needs +4.9% revenue. At EPS 156.6 the price is 2,914.", "The roll-forward at 7.0% uses the same cost of equity I question in Agent 1's DCF. The effect on my price is small (2,920 at 4.7%)."], "what_would_change_my_mind": ["Single biggest: a like-for-like forward P/E history for Nitori. If its 5-year forward median is near 16x rather than 19x, L2 falls and the price goes to about 2,741 (2,368 if Muji is also dropped and EPS is 156.6).", "H1 FY27/3 results clearly below plan EPS 161.05 (down about 70 JPY at 156.6).", "A larger comparable set (more than 4 peers, consolidated, same GAAP) that moves the peer median P/E by more than 1x: each 1x is about 0.45 x 161.05 x 1.07 = 78 JPY.", "Upward: evidence that Nitori's margin and ROE premium persists, e.g. a consolidated Seria or a Muji FY27/8 forward P/E that lifts the median, would move me toward 3,150 (weights 0.4/0.4/0.2)."], "questions_for_the_other_agent": ["Your 7.0% cost of equity is 2.3 points above the 4.7% the market implies. Which sourced Japan ERP or beta evidence rules out a cost of equity near 5.5-6.0%? What is your price at those values (tool run)?", "Your price of 2,071 implies 12.3x your FY28E EPS 168.81 (12.9x plan EPS 161.05) for a company with a 13.8% operating margin, 12.6% below the peer median 14.03x of home centres with 4.3-5.7% margins. How do you justify a discount to DCM and Kohnan?", "With terminal value at 87%, how much of your 1,300 JPY gap to me comes from terminal growth 1.0% plus capex 6.2% held for ever? Please give the price with capex 4.9% (FY54 actual) once Kawasaki (about 148.5 JPY per share undiscounted, 85 bn / 572.2 mn shares) is spent.", "Does your DCF have any check that would flag it if the result were inconsistent with every observed market multiple?"], "commands_run": ["python3 scripts/multiples_agent.py --json", "python3 scripts/agent_tools.py facts", "python3 scripts/agent_tools.py value (no overrides: FY27 EPS 156.6, FY28 EPS 168.81)", "python3 inline (read-only, imports scripts/multiples_agent.py): lens fair values, weights 1/3 each, 0.45/0.45/0.10, 0.5/0.5/0, 0.4/0.4/0.2; price roll-forward; leave-one-out per peer; jackknife SEs and inverse-variance weights; L5 with reported ROE 9.4/BPS 1,749.49 (FV 4,669) and with the table ROE column (FV 2,832); L2 variants 15.94/19.08/20.3; P/E vs ROE diagnostic; EPS 156.6 sensitivity; Ke 4.7% roll-forward"]}, "r2": {"agent": "2", "round": 2, "critique_of_other": [{"claim": "The DCF value supports about 14.6x FY27 plan EPS, near the peer median, so no premium is needed.", "problem": "This is circular. 14.61x is the DCF value today (2,352.4) divided by plan EPS 161.05, so it restates the DCF as a multiple; it is not market evidence. It also inherits the 7.0% cost of equity. The 14.03x peer median it is compared with is the midpoint of Seria (16.09x) and DCM (11.96x), and DCM's margin is 5.72% against Nitori's 13.76%.", "evidence": "own code: 2,352.4 / 161.05 = 14.61 (agent_tools.py value --set val.capex_pct_revenue=4.9); multiples_agent.py --json peer_table", "severity": "medium"}, {"claim": "A P/B of 1.79 needs ROE of about 11.7% against 9.4% reported, so the market overvalues Nitori.", "problem": "The identity ROE = P/B x (ke - g) + g simply restates the cost-of-equity disagreement. At the cost of equity Agent 1's own tool reports as market-implied after its capex change (5.43%), the ROE needed is 8.93%, which lies between Nitori's computed 8.76% and reported 9.4%. Applying the same identity (g 1%) to the peers gives implied costs of equity of 2.89% (Muji), 5.52% (Seria), 7.37% (DCM) and 7.46% (Kohnan); the peer median is 6.44% and Nitori's is 5.33-5.69%. In this sector a 7.0% rate matches the low-ROE home centres that trade below book, not the higher-quality names. Diagnostic only: it assumes steady state and the same g for all companies.", "evidence": "own code: 1.79 x (5.43 - 1) + 1 = 8.93; implied ke = 1 + (ROE - 1) / (P/B) on multiples_agent.py --json peer_table", "severity": "high"}, {"claim": "ERP is the biggest lever, and 7.0% is held because ERP is unsourced either way.", "problem": "We agree it is the biggest lever, but holding 5.0% is a choice, not a neutral default. If the peers' median implied cost of equity (6.44%) is treated as the market cross-check the DCF lacks, the implied ERP at beta 0.8 is 4.3%, and Agent 1's own model then gives 2,731 (value today 2,595.4, terminal value 88.2%). Across ERP 3.5-6.0% its price runs from 3,081 to 2,205, a span of about 880 JPY. My price moves 65 JPY between a 4.7% and a 7.0% roll-forward rate.", "evidence": "agent_tools.py value --set val.capex_pct_revenue=4.9 --set val.equity_risk_premium=4.3 -> 2,730.6; ERP 3.5 -> 3,081.4; ERP 6.0 -> 2,205 (Agent 1's run); my 2,920 at 4.7% vs 2,985", "severity": "high"}, {"claim": "Capex 6.2% -> 4.9% of revenue, because 6.2% held for ever plus the FY29 working-capital build implies a 3.1% return on new equity.", "problem": "I accept the logic: a terminal year that reinvests 32% of profit to grow 1% is internally inconsistent. Two caveats. First, 4.9% is one trough year after FY52-53 capex of 13-15% (Agent 1's own note), applied to FY27-29 below the 6.2% plan; Agent 1's own split case (2,508) shows the effect is small. Second, the same terminal-consistency logic argues for tying the terminal to a market cross-check of the cost of equity, which the agent still lacks.", "evidence": "debate3/round1_1.json key_numbers (3.09%, 2,560.9, 2,507.5); agent_tools.py value --set val.capex_pct_revenue=4.9 -> 2,485.0, TV 87.1%", "severity": "low"}, {"claim": "Agent 2's 3,369 is mostly today's price restated.", "problem": "Already conceded in my round 1, and 3,369 is not my price. My price is 2,985 (weights 0.45/0.45/0.10). None of my lenses uses today's price as an input. L2 (19.08x vs 19.80x now) is the near-restatement. Without L2 the price is 2,763 (L1 and L5 at 0.45 : 0.10, renormalised), or 2,385 with L1 alone.", "evidence": "own code: ((0.45 x 2,258.7 + 0.10 x 4,202.9) / 0.55) x 1.07 - 32 = 2,763.1; L1 2,258.7 x 1.07 - 32 = 2,384.8", "severity": "low"}, {"claim": "L5 leave-one-out 12m: 2,961 without Muji, 6,233 without Seria.", "problem": "The direction is correct, but the numbers do not reproduce exactly from the tool. multiples_agent.lens_values gives 2,927.1 without Muji and 6,145.7 without Seria. Agent 1's approximation refits on the rounded peer_table ROE values. The conclusion (L5 unstable) is unaffected.", "evidence": "inline python m.lens_values(drop='7453'/'2782'): FV 2,765.5 / 5,773.5, x1.07 - 32", "severity": "low"}], "accepted_from_other": ["Capex 4.9% with a consistent terminal is a fair correction of the default DCF (implied return on new equity 3.1% < 7.0%).", "The premium question is open. With all 4 peers, the P/E vs ROE fit at Nitori's ROE 8.76% gives 17.79x (R2 0.47, SE 10.1). Without Muji (stale FY26/8 forward P/E) it gives 13.29x (R2 0.91, SE 1.26, 12m 2,258), which supports Agent 1's view. Without Seria it gives 22.70x. My implied 17.51x (+24.8% to 14.03x) sits inside that 13.3-22.7x span but is not pinned down by it.", "L2 is close to a restatement of the market's view of Nitori (19.08x median vs 19.80x today), and without it my price is 2,763."], "revised_target_price_12m_jpy": 2985, "revised_confidence_0_1": 0.3, "changes_to_my_view": [{"what": "Target price (weights 0.45/0.45/0.10 on L1/L2/L5): unchanged", "from": 2985, "to": 2985, "reason": "Agent 1's new points work on its own DCF inputs (capex, terminal, ERP), or restate the cost-of-equity disagreement (14.6x, ROE 11.7%), or repeat what I conceded in round 1 (3,369 is not independent; L5 unstable). None of them gives a market multiple that contradicts my lenses. The one new piece of evidence that would lower me, the ex-Muji P/E-ROE fit at 13.29x, is offset by the ex-Seria fit at 22.70x. A 3-point fit cannot carry a price change. Computation unchanged: 0.45 x 2,258.7 + 0.45 x 3,072.8 + 0.10 x 4,202.9 = 2,819.5; x1.07 - 32 = 2,985."}, {"what": "Confidence: unchanged", "from": 0.3, "to": 0.3, "reason": "The premium is still unresolved (13.3-22.7x depending on one peer). No new data on a like-for-like forward P/E history."}], "final_statement": "I hold 2,985 (17.5x plan EPS, a 25% premium to the 14.03x peer median). I accept Agent 1's capex correction, and I accept that the premium is not pinned down: without Muji, ROE alone would support about 13.3x. But Agent 1's 14.6x and its 11.7% required ROE are its 7.0% cost of equity restated, not market evidence. Peers' P/B and ROE imply costs of equity of 2.9-7.5% (median 6.44%), with 7.0% at the low-ROE home-centre end. At that 6.44%, Agent 1's own model gives 2,731. const M=D.model, A2=D.a2;
const DEF={existing:[...M.existing],new:[...M.new],overseas:[...M.overseas],shimachu:[...M.shimachu],gm:[...M.gm],sga:[...M.sga],
  beta:M.beta,erp:M.erp,rf:M.rf,g:M.g,capex:M.capex,w_rel:M.w_rel,peer_w:M.peer_w,peers:M.peers.map(p=>p.name),conf1:0.3,conf2:0.3,force:{}};
let S=JSON.parse(JSON.stringify(DEF));

function calc(S){
  let nit=M.nitori_ext,shi=M.shimachu_ext,prev=M.revenue_fy54;const rows=[];
  for(let i=0;i<3;i++){
    const g=M.jp_share*(S.existing[i]+S.new[i])+(1-M.jp_share)*S.overseas[i];
    nit*=1+g;shi*=1+S.shimachu[i];const rev=nit+shi+M.rounding,om=S.gm[i]-S.sga[i],op=rev*om,np=op*M.conv,eps=np/M.shares;
    const da=rev*M.da,cx=rev*S.capex,ls=rev*M.lease,dn=M.nwc*(rev-prev),fcfe=np+da-cx-ls-dn;
    rows.push({rev,growth:rev/prev-1,om,op,np,eps,da,cx,ls,dn,fcfe,nitG:g});prev=rev;}
  const ke=S.rf+S.beta*S.erp,t0=M.stub_days/365,ts=[t0,t0+1,t0+2],sh=[t0,1,1];
  rows.forEach((r,i)=>{r.t=ts[i];r.share=sh[i];r.counted=r.fcfe*sh[i];r.df=1/Math.pow(1+ke,ts[i]);r.pv=r.counted*r.df;});
  const dcfAt=(k,g)=>{const tv=rows[2].fcfe*(1+g)/(k-g);let tot=tv/Math.pow(1+k,ts[2]);rows.forEach((r,i)=>tot+=r.counted/Math.pow(1+k,ts[i]));return tot/M.shares;};
  const sumpv=rows.reduce((a,r)=>a+r.pv,0),tv=rows[2].fcfe*(1+S.g)/(ke-S.g),pvtv=tv*rows[2].df,v0=(sumpv+pvtv)/M.shares,tpd=v0*(1+ke)-M.dps;
  const on=M.peers.filter(p=>S.peers.includes(p.name)),pm=median(on.map(p=>p.pe)),om=median(M.own_pe_hist);
  const tpe=Math.round((S.peer_w*pm+(1-S.peer_w)*om)*100+1e-7)/100,rel=tpe*rows[1].eps,bl=tpd;
  const er=bl/M.price-1+M.dps/M.price,alpha=(er-(S.rf+S.erp))*100;
  let imp=null;{let lo=S.g+0.0005,hi=0.2;if(dcfAt(lo,S.g)>M.price&&dcfAt(hi,S.g)<M.price){for(let k=0;k<60;k++){const mid=(lo+hi)/2;(dcfAt(mid,S.g)>M.price?lo=mid:hi=mid);}imp=(lo+hi)/2;}}
  const side=alpha>5?'Overweight':alpha<-5?'Underweight':'Neutral',size=M.confidence<0.5?'small':M.confidence<0.75?'medium':'full';
  return {rows,ke,v0,tpd,tvShare:pvtv/(sumpv+pvtv),sumpv,pvtv,tv,rel,tpe,pm,om,bl,er,alpha,imp,dcfAt,view:side==='Neutral'?side:side+', '+size,ts};}

  const b=sxx?sxy/sxx:0,a=my-b*mx;return {a,b,r2:syy?(sxy*sxy)/(sxx*syy):0};}
const LENS=[['L3','rev_growth','pe'],['L4','op_margin','pe'],['L5','roe','pb'],['L6','op_margin','ps']];
function lenses(peerNames,ke){
  const ps=M.peers.filter(p=>peerNames.includes(p.name)),base={L1:A2.plan_eps,L2:A2.plan_eps,L3:A2.plan_eps,L4:A2.plan_eps,L5:A2.bvps,L6:A2.sps},out=[];
  const nm={L1:'P/E, peer median',L2:'P/E, Nitori 5-year median',L3:'P/E vs revenue growth',L4:'P/E vs operating margin',L5:'P/B vs trailing ROE',L6:'P/S vs operating margin'};
  out.push({id:'L1',name:nm.L1,mult:median(ps.map(p=>p.pe)),inRange:true});out.push({id:'L2',name:nm.L2,mult:median(M.own_pe_hist),inRange:true});
  for(const [id,xk,yk] of LENS){const xs=ps.map(p=>p[xk]),ys=ps.map(p=>p[yk]),r=ols(xs,ys),xn=A2.nitori[xk],lo=Math.min(...xs),hi=Math.max(...xs);
    out.push({id,name:nm[id],mult:r.a+r.b*xn,inRange:xn>=lo&&xn<=hi,fit:r,xk,yk,xs,ys,xn,lo,hi});}
  out.forEach(l=>{l.fv=l.mult*base[l.id];l.tp=l.fv*(1+ke)-M.dps;l.base=base[l.id];l.counts=S.force[l.id]!==undefined?S.force[l.id]:l.inRange;});
  const c=out.filter(l=>l.counts),fv=c.length?c.reduce((a,l)=>a+l.fv,0)/c.length:null;
  return {list:out,fv,tp:fv==null?null:fv*(1+ke)-M.dps,all6:out.reduce((a,l)=>a+l.fv,0)/6*(1+ke)-M.dps,n:c.length};}
